<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sprout subsystem tests</title>
</head>
<body>
    <h1>Sprout subsystem tests</h1>
    <pre id="result">Running tests…</pre>

    <script src="./subsystems/normalise_text.js"></script>
    <script src="./subsystems/tokeniser.js"></script>
    <script>
        const output = document.getElementById("result");
        const tests = [
            {
                name: "normalise_text: lowercase, trim, and collapse whitespace",
                run: () => normalise_text("  HELLO   WORLD  "),
                expected: "hello world"
            },
            {
                name: "tokenise: words and repeated punctuation",
                run: () => tokenise("buy milk!!!"),
                expected: ["buy", "milk", "!", "!", "!"]
            },
            {
                name: "tokenise: punctuation gets its own token",
                run: () => tokenise("Hello, WORLD!"),
                expected: ["Hello", ",", "WORLD", "!"]
            },
            {
                name: "tokenise: preserve apostrophes inside words",
                run: () => tokenise("don't stop."),
                expected: ["don't", "stop", "."]
            },
            {
                name: "tokenise: whitespace-only input",
                run: () => tokenise("   "),
                expected: []
            }
        ];

        const results = tests.map(test => {
            try {
                const actual = test.run();
                const passed = JSON.stringify(actual) === JSON.stringify(test.expected);
                return {
                    name: test.name,
                    passed,
                    details: passed
                        ? "PASS"
                        : "FAIL\n  Expected: " + JSON.stringify(test.expected) +
                          "\n  Actual:   " + JSON.stringify(actual)
                };
            } catch (error) {
                return {
                    name: test.name,
                    passed: false,
                    details: "ERROR: " + error.message
                };
            }
        });

        const passedCount = results.filter(result => result.passed).length;
        output.textContent =
            results.map(result => (result.passed ? "✓ " : "✗ ") + result.name +
                "\n  " + result.details).join("\n\n") +
            "\n\n" + passedCount + "/" + results.length + " tests passed.";
        output.style.color = passedCount === results.length ? "green" : "red";
    </script>
</body>
</html>
